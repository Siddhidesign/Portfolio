<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <title>Siddhi Manche · UX researcher and designer for B2B workflows and AI</title>
    <meta name="description" content="Siddhi Manche went from front-end developer to B2B workflow designer to AI UX designer. She optimizes B2B workflows by understanding employees, and now researches and designs with AI." />
    <link rel="icon" href="https://siddhidesign.github.io/Portfolio/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./app/index-CbudvQS6.js"></script>
    <link rel="stylesheet" crossorigin href="./app/index-DXbNlzAH.css">
    <script type="module">
      // Projects first. The next build already has this order (site-src/src/App.tsx);
      // until then, move the project overview and cards above "Same designer, four versions."
      const reorder = () => {
        const main = document.querySelector("main"), story = document.getElementById("story"), runs = document.getElementById("runs");
        const deck = runs && runs.nextElementSibling;
        if (!main || !story || !runs || !deck || !deck.classList.contains("deck")) return false;
        if (runs.compareDocumentPosition(story) & Node.DOCUMENT_POSITION_FOLLOWING) return true;
        main.insertBefore(runs, story);
        main.insertBefore(deck, story);
        const tabs = document.querySelector("header .tabs");
        const tr = tabs && tabs.querySelector('a[href="#runs"]'), ts = tabs && tabs.querySelector('a[href="#story"]');
        if (tr && ts) tabs.insertBefore(tr, ts);
        return true;
      };
      if (!reorder()) {
        const mo = new MutationObserver(() => { if (reorder()) mo.disconnect(); });
        mo.observe(document.getElementById("root"), { childList: true, subtree: true });
        setTimeout(() => mo.disconnect(), 8000);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

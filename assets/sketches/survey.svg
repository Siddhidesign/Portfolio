<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <style>
    .s{stroke:#32404f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .n{fill:none}
    .c1{animation:ck 6s ease-in-out infinite;transform-origin:132px 92px}
    .c2{animation:ck 6s ease-in-out 1.1s infinite;transform-origin:132px 128px}
    .c3{animation:ck 6s ease-in-out 2.2s infinite;transform-origin:132px 164px}
    .pen{animation:write 6s ease-in-out infinite}
    .b1{animation:grow 6s ease-in-out 3s infinite;transform-origin:308px 246px}
    .b2{animation:grow 6s ease-in-out 3.3s infinite;transform-origin:328px 246px}
    .b3{animation:grow 6s ease-in-out 3.6s infinite;transform-origin:348px 246px}
    @keyframes ck{0%,6%{opacity:0;transform:scale(.4)}16%,100%{opacity:1;transform:scale(1)}}
    @keyframes write{0%,100%{transform:translate(0,0) rotate(0deg)}
      20%{transform:translate(-2px,36px) rotate(-2deg)}
      40%{transform:translate(-1px,72px) rotate(1deg)}
      60%{transform:translate(0,40px) rotate(0deg)}}
    @keyframes grow{0%,10%{transform:scaleY(.08)}40%,100%{transform:scaleY(1)}}
  </style>

  <ellipse cx="200" cy="192" rx="178" ry="88" fill="#cde7d8" opacity=".42"/>

  <!-- ================= CLIPBOARD ================= -->
  <path class="s" d="M104 52 h150 a9 9 0 0 1 9 9 v186 a9 9 0 0 1 -9 9 h-150 a9 9 0 0 1 -9 -9 v-186 a9 9 0 0 1 9 -9 z" fill="#fff"/>
  <!-- metal clip -->
  <path class="s" d="M158 40 h42 a6 6 0 0 1 6 6 v14 h-54 v-14 a6 6 0 0 1 6 -6 z" fill="#fad29d"/>
  <path class="s n" d="M170 40 v-6 a9 9 0 0 1 18 0 v6" opacity=".7"/>

  <!-- form title -->
  <path class="s n" d="M118 74 h58" stroke-width="3.6" opacity=".6"/>

  <!-- Q1 -->
  <g class="c1"><rect class="s" x="120" y="80" width="22" height="22" rx="5" fill="#cde7d8"/><path class="s n" d="M126 91 l4 4.5 l7 -9"/></g>
  <path class="s n" d="M154 86 h84 M154 96 h64" opacity=".4"/>
  <!-- Q2 -->
  <g class="c2"><rect class="s" x="120" y="116" width="22" height="22" rx="5" fill="#c7d4f2"/><path class="s n" d="M126 127 l4 4.5 l7 -9"/></g>
  <path class="s n" d="M154 122 h84 M154 132 h56" opacity=".4"/>
  <!-- Q3 -->
  <g class="c3"><rect class="s" x="120" y="152" width="22" height="22" rx="5" fill="#fad29d"/><path class="s n" d="M126 163 l4 4.5 l7 -9"/></g>
  <path class="s n" d="M154 158 h84 M154 168 h72" opacity=".4"/>

  <!-- likert scale -->
  <path class="s n" d="M120 196 h118" opacity=".3"/>
  <circle class="s" cx="128" cy="212" r="7" fill="#c2410c"/>
  <circle class="s" cx="156" cy="212" r="7" fill="#c2410c"/>
  <circle class="s" cx="184" cy="212" r="7" fill="#c2410c"/>
  <circle class="s n" cx="212" cy="212" r="7"/>
  <circle class="s n" cx="240" cy="212" r="7"/>
  <path class="s n" d="M120 232 h60" opacity=".3"/>

  <!-- ================= HAND + PENCIL ================= -->
  <g class="pen">
    <!-- forearm -->
    <path class="s" d="M330 122 c-16 -6 -34 -4 -46 6" fill="#c7d4f2"/>
    <!-- hand -->
    <path class="s" d="M288 124 c-10 2 -16 10 -14 18 c1 6 7 10 14 9 c7 -1 12 -6 13 -13 c1 -8 -5 -15 -13 -14 z" fill="#eec9a8"/>
    <!-- pencil -->
    <path class="s" d="M296 138 l30 -44" stroke-width="9" stroke-linecap="butt" stroke="#fad29d"/>
    <path class="s n" d="M296 138 l30 -44" stroke-width="9" stroke-linecap="butt"/>
    <path class="s" d="M322 98 l10 -14 l4 12 z" fill="#fff"/>
    <path class="s" d="M290 146 l7 -10 l5 4 z" fill="#32404f"/>
  </g>

  <!-- ================= RESULT CHART ================= -->
  <path class="s n" d="M296 246 h64" opacity=".5"/>
  <rect class="b1 s" x="300" y="214" width="14" height="32" rx="2" fill="#c7d4f2"/>
  <rect class="b2 s" x="320" y="198" width="14" height="48" rx="2" fill="#0a7a4d"/>
  <rect class="b3 s" x="340" y="222" width="14" height="24" rx="2" fill="#c2410c"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <style>
    .ink{stroke:#32404f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .bob{animation:bob 3.4s ease-in-out infinite}
    .n1{animation:tilt 3s ease-in-out infinite;transform-origin:150px 90px}
    .fly{animation:fly 4.5s ease-in-out infinite;transform-origin:290px 120px}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
    @keyframes fly{0%{opacity:0;transform:translate(30px,40px) rotate(12deg)}35%,80%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(0,0)}}
  </style>
  <ellipse cx="200" cy="185" rx="170" ry="98" fill="#fad29d" opacity=".4"/>
  <!-- wall / board -->
  <rect class="ink" x="88" y="52" width="230" height="150" rx="8" fill="#fff"/>
  <!-- sticky notes -->
  <rect x="104" y="70" width="34" height="34" rx="3" fill="#c7d4f2"/>
  <g class="n1"><rect x="148" y="70" width="34" height="34" rx="3" fill="#fad29d"/></g>
  <rect x="192" y="70" width="34" height="34" rx="3" fill="#cde7d8"/>
  <rect x="104" y="114" width="34" height="34" rx="3" fill="#cde7d8"/>
  <rect x="148" y="114" width="34" height="34" rx="3" fill="#c7d4f2"/>
  <rect x="192" y="114" width="34" height="34" rx="3" fill="#f6c9b4"/>
  <rect x="104" y="158" width="34" height="34" rx="3" fill="#fad29d"/>
  <rect x="148" y="158" width="34" height="34" rx="3" fill="#f6c9b4"/>
  <!-- note being placed -->
  <g class="fly"><rect x="236" y="114" width="34" height="34" rx="3" fill="#e6612e" opacity=".85"/></g>
  <!-- scribbles on notes -->
  <line class="ink" x1="110" y1="82" x2="130" y2="82" opacity=".35"/>
  <line class="ink" x1="110" y1="90" x2="126" y2="90" opacity=".35"/>
  <line class="ink" x1="154" y1="126" x2="174" y2="126" opacity=".35"/>
  <line class="ink" x1="198" y1="82" x2="218" y2="82" opacity=".35"/>
  <!-- cluster circle -->
  <ellipse class="ink" cx="121" cy="139" rx="30" ry="42" opacity=".4" stroke-dasharray="6 7"/>
  <!-- person reaching -->
  <g class="bob">
    <circle class="ink" cx="322" cy="150" r="20"/>
    <path class="ink" d="M306 143 q9 -13 28 -5" opacity=".6"/>
    <circle fill="#32404f" cx="317" cy="151" r="2.3"/>
    <circle fill="#32404f" cx="329" cy="151" r="2.3"/>
    <path class="ink" d="M319 161 q4.5 3.5 9 0"/>
    <path class="ink" d="M322 170 q14 10 12 68"/>
    <path class="ink" d="M322 170 q-20 -6 -46 -32"/>
  </g>
</svg>

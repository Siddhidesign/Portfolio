<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <style>
    .ink{stroke:#32404f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .bob{animation:bob 3.4s ease-in-out infinite}
    .bob2{animation:bob 3.4s ease-in-out .9s infinite}
    .bub{animation:pulse 2.6s ease-in-out infinite;transform-origin:120px 70px}
    .dots circle{animation:blink 1.8s ease-in-out infinite}
    .dots circle:nth-child(2){animation-delay:.3s}
    .dots circle:nth-child(3){animation-delay:.6s}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  </style>
  <ellipse cx="200" cy="190" rx="165" ry="95" fill="#c7d4f2" opacity=".45"/>
  <!-- table -->
  <line class="ink" x1="120" y1="215" x2="280" y2="215"/>
  <line class="ink" x1="140" y1="215" x2="132" y2="258"/>
  <line class="ink" x1="260" y1="215" x2="268" y2="258"/>
  <!-- coffee cup -->
  <path class="ink" d="M188 202 h20 l-3 13 h-14 z"/>
  <path class="ink" d="M196 194 q2 -5 0 -9" opacity=".5"/>
  <!-- participant (left) -->
  <g class="bob">
    <circle class="ink" cx="120" cy="140" r="21"/>
    <path class="ink" d="M104 132 q6 -12 24 -8" opacity=".6"/>
    <circle fill="#32404f" cx="114" cy="141" r="2.4"/>
    <circle fill="#32404f" cx="127" cy="141" r="2.4"/>
    <path class="ink" d="M116 151 q5 4 10 0"/>
    <path class="ink" d="M120 161 q-24 8 -26 54"/>
    <path class="ink" d="M120 161 q20 7 24 34 l16 16"/>
  </g>
  <!-- speech bubble -->
  <g class="bub">
    <rect class="ink" x="88" y="52" width="64" height="36" rx="12" fill="#fff"/>
    <path class="ink" d="M112 88 l-4 12 l12 -12" fill="#fff"/>
    <g class="dots">
      <circle fill="#e6612e" cx="106" cy="70" r="3.4"/>
      <circle fill="#e6612e" cx="120" cy="70" r="3.4"/>
      <circle fill="#e6612e" cx="134" cy="70" r="3.4"/>
    </g>
  </g>
  <!-- researcher (right) with notepad -->
  <g class="bob2">
    <circle class="ink" cx="282" cy="136" r="21"/>
    <path class="ink" d="M266 128 q10 -14 30 -4" opacity=".6"/>
    <circle fill="#32404f" cx="276" cy="137" r="2.4"/>
    <circle fill="#32404f" cx="289" cy="137" r="2.4"/>
    <path class="ink" d="M278 147 q5 3.5 9 0"/>
    <path class="ink" d="M282 157 q24 8 26 58"/>
    <path class="ink" d="M282 157 q-18 6 -24 30 l-14 14"/>
    <!-- notepad -->
    <rect class="ink" x="222" y="190" width="34" height="42" rx="4" fill="#fad29d"/>
    <line class="ink" x1="229" y1="202" x2="249" y2="202" opacity=".55"/>
    <line class="ink" x1="229" y1="211" x2="249" y2="211" opacity=".55"/>
    <line class="ink" x1="229" y1="220" x2="243" y2="220" opacity=".55"/>
  </g>
</svg>

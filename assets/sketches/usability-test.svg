<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <style>
    .s{stroke:#32404f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .n{fill:none}
    .breathe{animation:br 4.4s ease-in-out infinite}
    .breathe2{animation:br 4.4s ease-in-out 1.3s infinite}
    .cur{animation:cur 5s ease-in-out infinite}
    .tick{animation:tk 5s ease-in-out infinite;transform-origin:243px 158px}
    .hand{animation:tap 5s ease-in-out infinite}
    @keyframes br{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
    @keyframes cur{0%,100%{transform:translate(0,0)}30%{transform:translate(30px,14px)}55%{transform:translate(12px,26px)}80%{transform:translate(34px,4px)}}
    @keyframes tk{0%,60%{opacity:0;transform:scale(.5)}72%,100%{opacity:1;transform:scale(1)}}
    @keyframes tap{0%,100%{transform:translateY(0)}30%{transform:translateY(-3px)}}
  </style>

  <ellipse cx="200" cy="200" rx="178" ry="84" fill="#cde7d8" opacity=".45"/>

  <!-- ============ DESK ============ -->
  <path class="s" d="M74 218 h252 v7 h-252 z" fill="#fff"/>
  <path class="s n" d="M100 225 l-7 38 M300 225 l7 38"/>

  <!-- ============ LAPTOP ============ -->
  <path class="s" d="M154 148 h96 a5 5 0 0 1 5 5 v58 h-106 v-58 a5 5 0 0 1 5 -5 z" fill="#fff"/>
  <path class="s" d="M142 211 h126 l6 7 h-138 z" fill="#eef1f5"/>
  <!-- screen ui -->
  <rect class="s n" x="163" y="158" width="30" height="20" rx="3" opacity=".5"/>
  <path class="s n" d="M201 163 h40 M201 172 h30" opacity=".4"/>
  <rect class="s n" x="163" y="186" width="78" height="9" rx="4.5" opacity=".5"/>
  <path class="s n" d="M163 202 h50" opacity=".35"/>
  <g class="cur"><path d="M176 166 l11 4.5 -4.8 2 -2 4.8 z" fill="#c2410c"/></g>
  <g class="tick"><circle cx="243" cy="158" r="8.5" fill="#0a7a4d"/><path d="M239 158 l3 3.2 l5.5 -6.4" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>

  <!-- ============ PARTICIPANT (left, testing) ============ -->
  <g class="breathe">
    <g><path d="M86 178 c-13 9 -17 23 -16 36" stroke="#32404f" stroke-width="15" stroke-linecap="round" fill="none"/><path d="M86 178 c-13 9 -17 23 -16 36" stroke="#aebfe8" stroke-width="11" stroke-linecap="round" fill="none"/></g>
    <path class="s" d="M74 218 c-2 -28 2 -46 10 -54 c6 -6 12 -8 18 -8 c7 0 13 3 18 9 c7 9 10 29 8 53 z" fill="#c7d4f2"/>
    <path class="s n" d="M94 157 l8 9 l8 -9"/>
    <!-- arm to trackpad -->
    <g class="hand">
      <g><path d="M120 178 c14 6 22 14 28 24" stroke="#32404f" stroke-width="15" stroke-linecap="round" fill="none"/><path d="M120 178 c14 6 22 14 28 24" stroke="#c7d4f2" stroke-width="11" stroke-linecap="round" fill="none"/></g>
      <ellipse class="s" cx="154" cy="207" rx="8" ry="6" fill="#eec9a8"/>
    </g>
    <path class="s" d="M95 150 h14 v9 h-14 z" fill="#eec9a8"/>
    <ellipse class="s" cx="102" cy="128" rx="21" ry="23" fill="#eec9a8"/>
    <!-- long hair -->
    <path class="s" d="M81 128 c-3 -20 10 -30 21 -30 c12 0 23 10 21 28 c-4 -9 -11 -14 -20 -13 c-9 1 -16 6 -22 15 z" fill="#4a2f22"/>
    <path class="s" d="M81 126 c-5 14 -4 30 1 42 c5 -8 6 -22 4 -34 z" fill="#4a2f22"/>
    <circle fill="#32404f" cx="96" cy="129" r="2.1"/>
    <circle fill="#32404f" cx="110" cy="129" r="2.1"/>
    <path class="s n" d="M98 138 c3 3 7 3 10 0"/>
  </g>

  <!-- ============ FACILITATOR (right, observing + clipboard) ============ -->
  <g class="breathe2">
    <g><path d="M320 180 c12 9 16 23 15 34" stroke="#32404f" stroke-width="15" stroke-linecap="round" fill="none"/><path d="M320 180 c12 9 16 23 15 34" stroke="#b6dcc6" stroke-width="11" stroke-linecap="round" fill="none"/></g>
    <path class="s" d="M330 218 c2 -27 -2 -44 -10 -52 c-6 -6 -11 -8 -17 -8 c-7 0 -12 3 -17 9 c-7 9 -9 27 -7 51 z" fill="#cde7d8"/>
    <path class="s n" d="M311 158 l-8 9 l-8 -9"/>
    <!-- arm holding clipboard -->
    <g><path d="M286 180 c-11 5 -18 11 -22 18" stroke="#32404f" stroke-width="15" stroke-linecap="round" fill="none"/><path d="M286 180 c-11 5 -18 11 -22 18" stroke="#cde7d8" stroke-width="11" stroke-linecap="round" fill="none"/></g>
    <path class="s" d="M296 152 h13 v9 h-13 z" fill="#d9a884"/>
    <ellipse class="s" cx="303" cy="131" rx="20" ry="22" fill="#d9a884"/>
    <path class="s" d="M283 130 c-2 -18 10 -27 20 -27 c11 0 21 9 20 26 c-4 -8 -9 -12 -17 -12 c-9 0 -16 5 -23 13 z" fill="#2f3a46"/>
    <circle fill="#32404f" cx="297" cy="132" r="2"/>
    <circle fill="#32404f" cx="310" cy="132" r="2"/>
    <path class="s n" d="M299 140 c3 2.5 6 2.5 9 0"/>
    <!-- clipboard -->
    <path class="s" d="M252 176 h32 a4 4 0 0 1 4 4 v40 a4 4 0 0 1 -4 4 h-32 a4 4 0 0 1 -4 -4 v-40 a4 4 0 0 1 4 -4 z" fill="#c7d4f2"/>
    <path class="s" d="M261 172 h14 a3 3 0 0 1 3 3 v4 h-20 v-4 a3 3 0 0 1 3 -3 z" fill="#fff"/>
    <path class="s n" d="M256 191 h20 M256 199 h20 M256 207 h13" opacity=".55"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <style>
    .ink{stroke:#32404f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .bob{animation:bob 3.2s ease-in-out infinite}
    .bob2{animation:bob 3.2s ease-in-out 1.1s infinite}
    .cur{animation:cur 4s ease-in-out infinite}
    .tick{animation:pop 4s ease-in-out infinite}
    .watch{animation:sway 3.6s ease-in-out infinite;transform-origin:330px 60px}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes cur{0%,100%{transform:translate(0,0)}30%{transform:translate(26px,10px)}60%{transform:translate(10px,22px)}}
    @keyframes pop{0%,55%{opacity:0;transform:scale(.6)}70%,100%{opacity:1;transform:scale(1)}}
    @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  </style>
  <ellipse cx="200" cy="195" rx="170" ry="92" fill="#cde7d8" opacity=".5"/>
  <!-- desk -->
  <line class="ink" x1="95" y1="222" x2="305" y2="222"/>
  <!-- laptop -->
  <rect class="ink" x="160" y="158" width="88" height="58" rx="6" fill="#fff"/>
  <path class="ink" d="M152 222 h104 l-8 -6 h-88 z" fill="#fff"/>
  <!-- wireframe on screen -->
  <rect class="ink" x="170" y="167" width="26" height="16" rx="3" opacity=".55"/>
  <line class="ink" x1="204" y1="171" x2="238" y2="171" opacity=".45"/>
  <line class="ink" x1="204" y1="179" x2="230" y2="179" opacity=".45"/>
  <rect class="ink" x="170" y="191" width="68" height="10" rx="5" opacity=".55"/>
  <!-- cursor -->
  <g class="cur"><path d="M182 172 l10 4 -4.5 1.8 -1.8 4.5 z" fill="#e6612e"/></g>
  <!-- task tick -->
  <g class="tick" style="transform-origin:242px 166px"><circle cx="242" cy="166" r="8" fill="#03ae6f"/><path d="M238 166 l3 3 l5 -6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- participant (left) -->
  <g class="bob">
    <circle class="ink" cx="112" cy="130" r="21"/>
    <path class="ink" d="M96 122 q8 -13 28 -6" opacity=".6"/>
    <circle fill="#32404f" cx="107" cy="131" r="2.4"/>
    <circle fill="#32404f" cx="120" cy="131" r="2.4"/>
    <path class="ink" d="M109 141 q4.5 3.5 9 0"/>
    <path class="ink" d="M112 151 q-20 9 -22 62"/>
    <path class="ink" d="M112 151 q24 8 42 32"/>
  </g>
  <!-- facilitator (right) with clipboard -->
  <g class="bob2">
    <circle class="ink" cx="300" cy="122" r="19"/>
    <path class="ink" d="M286 114 q9 -12 27 -4" opacity=".6"/>
    <circle fill="#32404f" cx="295" cy="123" r="2.2"/>
    <circle fill="#32404f" cx="307" cy="123" r="2.2"/>
    <path class="ink" d="M297 132 q4 3 8 0"/>
    <path class="ink" d="M300 141 q20 8 20 74"/>
    <path class="ink" d="M300 141 q-16 6 -22 26"/>
    <rect class="ink" x="258" y="168" width="30" height="40" rx="4" fill="#c7d4f2"/>
    <line class="ink" x1="264" y1="180" x2="282" y2="180" opacity=".55"/>
    <line class="ink" x1="264" y1="189" x2="282" y2="189" opacity=".55"/>
    <line class="ink" x1="264" y1="198" x2="276" y2="198" opacity=".55"/>
  </g>
  <!-- stopwatch -->
  <g class="watch">
    <circle class="ink" cx="330" cy="60" r="16" fill="#fff"/>
    <line class="ink" x1="330" y1="60" x2="330" y2="50"/>
    <line class="ink" x1="330" y1="60" x2="337" y2="63"/>
    <line class="ink" x1="330" y1="40" x2="330" y2="36"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <style>
    .ink{stroke:#32404f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .bob{animation:bob 3.4s ease-in-out infinite}
    .ring{animation:ring 2.4s ease-in-out infinite;transform-origin:96px 96px}
    .p1{animation:drift 5s ease-in-out infinite}
    .p2{animation:drift 5s ease-in-out 1.4s infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes ring{0%,100%{transform:rotate(-8deg)}20%{transform:rotate(10deg)}40%{transform:rotate(-8deg)}}
    @keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-3deg)}}
  </style>
  <ellipse cx="200" cy="190" rx="172" ry="95" fill="#fad29d" opacity=".4"/>
  <!-- stacked boxes -->
  <rect class="ink" x="236" y="160" width="58" height="50" rx="4" fill="#fff"/>
  <rect class="ink" x="252" y="118" width="58" height="42" rx="4" fill="#fff"/>
  <line class="ink" x1="236" y1="184" x2="294" y2="184" opacity=".4"/>
  <line class="ink" x1="265" y1="160" x2="265" y2="210" opacity=".4"/>
  <path class="ink" d="M252 138 h58" opacity=".4"/>
  <rect class="ink" x="300" y="176" width="44" height="34" rx="4" fill="#cde7d8"/>
  <!-- flying spreadsheets -->
  <g class="p1">
    <rect class="ink" x="66" y="150" width="56" height="44" rx="4" fill="#fff"/>
    <line class="ink" x1="66" y1="164" x2="122" y2="164" opacity=".5"/>
    <line class="ink" x1="66" y1="178" x2="122" y2="178" opacity=".5"/>
    <line class="ink" x1="85" y1="150" x2="85" y2="194" opacity=".5"/>
    <line class="ink" x1="104" y1="150" x2="104" y2="194" opacity=".5"/>
  </g>
  <g class="p2">
    <rect class="ink" x="96" y="206" width="56" height="44" rx="4" fill="#c7d4f2"/>
    <line class="ink" x1="96" y1="220" x2="152" y2="220" opacity=".5"/>
    <line class="ink" x1="96" y1="234" x2="152" y2="234" opacity=".5"/>
    <line class="ink" x1="115" y1="206" x2="115" y2="250" opacity=".5"/>
    <line class="ink" x1="134" y1="206" x2="134" y2="250" opacity=".5"/>
  </g>
  <!-- phone ringing -->
  <g class="ring">
    <rect class="ink" x="82" y="78" width="28" height="44" rx="8" fill="#fff"/>
    <path class="ink" d="M70 74 q-8 22 0 44" opacity=".5"/>
    <path class="ink" d="M122 74 q8 22 0 44" opacity=".5"/>
  </g>
  <!-- person in the middle, juggling it all -->
  <g class="bob">
    <circle class="ink" cx="196" cy="120" r="22"/>
    <path class="ink" d="M179 112 q9 -14 30 -6" opacity=".6"/>
    <circle fill="#32404f" cx="190" cy="121" r="2.4"/>
    <circle fill="#32404f" cx="203" cy="121" r="2.4"/>
    <path class="ink" d="M192 132 q5 3 9 0"/>
    <path class="ink" d="M196 142 q-4 30 -2 96" />
    <path class="ink" d="M196 148 q-30 4 -60 -14"/>
    <path class="ink" d="M196 148 q30 6 52 20"/>
  </g>
  <!-- sweat drop -->
  <path class="ink" d="M226 96 q6 8 0 12 q-6 -4 0 -12" fill="#c7d4f2"/>
</svg>

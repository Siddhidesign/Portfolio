<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <style>
    .ink{stroke:#32404f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .mag{animation:mag 5.5s ease-in-out infinite}
    .m1{animation:mark 5.5s ease-in-out infinite}
    .m2{animation:mark 5.5s ease-in-out 1.8s infinite}
    .m3{animation:mark 5.5s ease-in-out 3.6s infinite}
    @keyframes mag{0%,100%{transform:translate(0,0)}33%{transform:translate(96px,6px)}66%{transform:translate(192px,-4px)}}
    @keyframes mark{0%,20%{opacity:0;transform:scale(.5)}30%,100%{opacity:1;transform:scale(1)}}
  </style>
  <ellipse cx="200" cy="180" rx="172" ry="98" fill="#c7d4f2" opacity=".4"/>
  <!-- three phones -->
  <g>
    <rect class="ink" x="72" y="70" width="72" height="140" rx="12" fill="#fff"/>
    <line class="ink" x1="96" y1="82" x2="120" y2="82" opacity=".4"/>
    <rect class="ink" x="84" y="94" width="48" height="26" rx="4" opacity=".5"/>
    <line class="ink" x1="84" y1="132" x2="132" y2="132" opacity=".4"/>
    <line class="ink" x1="84" y1="142" x2="122" y2="142" opacity=".4"/>
    <rect class="ink" x="84" y="156" width="48" height="12" rx="6" opacity=".5"/>
    <g class="m1" style="transform-origin:140px 78px"><circle cx="140" cy="78" r="11" fill="#e6612e"/><path d="M135.5 73.5 l9 9 M144.5 73.5 l-9 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
  </g>
  <g>
    <rect class="ink" x="164" y="70" width="72" height="140" rx="12" fill="#fff"/>
    <rect class="ink" x="176" y="86" width="48" height="40" rx="4" opacity=".5"/>
    <line class="ink" x1="176" y1="140" x2="224" y2="140" opacity=".4"/>
    <line class="ink" x1="176" y1="150" x2="212" y2="150" opacity=".4"/>
    <g class="m2" style="transform-origin:232px 78px"><circle cx="232" cy="78" r="11" fill="#e6612e"/><path d="M227.5 73.5 l9 9 M236.5 73.5 l-9 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
  </g>
  <g>
    <rect class="ink" x="256" y="70" width="72" height="140" rx="12" fill="#fff"/>
    <circle class="ink" cx="292" cy="106" r="18" opacity=".5"/>
    <line class="ink" x1="268" y1="140" x2="316" y2="140" opacity=".4"/>
    <rect class="ink" x="268" y="152" width="48" height="12" rx="6" opacity=".5"/>
    <g class="m3" style="transform-origin:324px 78px"><circle cx="324" cy="78" r="11" fill="#03ae6f"/><path d="M319 78 l4 4 l7 -8" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <!-- magnifier sweeping -->
  <g class="mag">
    <circle class="ink" cx="96" cy="230" r="26" fill="#fff" opacity=".9" stroke-width="4"/>
    <line class="ink" x1="115" y1="249" x2="136" y2="268" stroke-width="5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <style>
    .s{stroke:#32404f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .n{fill:none}
    .mag{animation:sweep 7s ease-in-out infinite}
    .m1{animation:mk 7s ease-in-out .6s infinite;transform-origin:132px 66px}
    .m2{animation:mk 7s ease-in-out 2.9s infinite;transform-origin:236px 66px}
    .m3{animation:mk 7s ease-in-out 5.2s infinite;transform-origin:340px 66px}
    @keyframes sweep{0%,100%{transform:translate(0,0)}
      14%,28%{transform:translate(0,0)}
      42%,56%{transform:translate(104px,4px)}
      70%,88%{transform:translate(208px,-2px)}}
    @keyframes mk{0%,8%{opacity:0;transform:scale(.4)}18%,100%{opacity:1;transform:scale(1)}}
  </style>

  <ellipse cx="200" cy="186" rx="180" ry="92" fill="#c7d4f2" opacity=".34"/>

  <!-- ================= PHONE 1 (fails) ================= -->
  <g>
    <path class="s" d="M62 44 h68 a13 13 0 0 1 13 13 v152 a13 13 0 0 1 -13 13 h-68 a13 13 0 0 1 -13 -13 v-152 a13 13 0 0 1 13 -13 z" fill="#fff"/>
    <path class="s n" d="M84 55 h24" stroke-width="3.4" opacity=".5"/>
    <!-- cramped, unlabelled UI -->
    <path class="s n" d="M60 74 h30" opacity=".45"/>
    <rect class="s n" x="60" y="84" width="72" height="15" rx="2" opacity=".45"/>
    <rect class="s n" x="60" y="103" width="72" height="15" rx="2" opacity=".45"/>
    <rect class="s n" x="60" y="122" width="72" height="15" rx="2" opacity=".45"/>
    <rect class="s" x="60" y="148" width="46" height="15" rx="3" fill="#dfe4ea"/>
    <path class="s n" d="M60 178 h72 M60 188 h52" opacity=".3"/>
    <path class="s n" d="M49 198 h94" opacity=".35"/>
    <g class="m1"><circle cx="132" cy="66" r="12" fill="#c2410c"/><path d="M127 61 l10 10 M137 61 l-10 10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
  </g>

  <!-- ================= PHONE 2 (fails) ================= -->
  <g>
    <path class="s" d="M166 44 h68 a13 13 0 0 1 13 13 v152 a13 13 0 0 1 -13 13 h-68 a13 13 0 0 1 -13 -13 v-152 a13 13 0 0 1 13 -13 z" fill="#fff"/>
    <path class="s n" d="M188 55 h24" stroke-width="3.4" opacity=".5"/>
    <rect class="s n" x="164" y="72" width="72" height="46" rx="3" opacity=".45"/>
    <path class="s n" d="M164 130 h72 M164 140 h58 M164 150 h66" opacity=".33"/>
    <rect class="s" x="164" y="166" width="72" height="16" rx="8" fill="#dfe4ea"/>
    <path class="s n" d="M153 198 h94" opacity=".35"/>
    <g class="m2"><circle cx="236" cy="66" r="12" fill="#c2410c"/><path d="M231 61 l10 10 M241 61 l-10 10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
  </g>

  <!-- ================= PHONE 3 (passes) ================= -->
  <g>
    <path class="s" d="M270 44 h68 a13 13 0 0 1 13 13 v152 a13 13 0 0 1 -13 13 h-68 a13 13 0 0 1 -13 -13 v-152 a13 13 0 0 1 13 -13 z" fill="#fff"/>
    <path class="s n" d="M292 55 h24" stroke-width="3.4" opacity=".5"/>
    <!-- clear labelled UI -->
    <path class="s n" d="M268 74 h34" opacity=".5"/>
    <rect class="s n" x="268" y="82" width="72" height="17" rx="3" opacity=".5"/>
    <path class="s n" d="M268 108 h30" opacity=".5"/>
    <rect class="s n" x="268" y="116" width="72" height="17" rx="3" opacity=".5"/>
    <rect class="s" x="268" y="146" width="72" height="18" rx="9" fill="#c7d4f2"/>
    <path class="s n" d="M257 198 h94" opacity=".35"/>
    <g class="m3"><circle cx="340" cy="66" r="12" fill="#0a7a4d"/><path d="M334 66 l4.5 4.5 l7.5 -8.5" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  </g>

  <!-- ================= MAGNIFIER ================= -->
  <g class="mag">
    <circle cx="96" cy="240" r="30" fill="#fff" fill-opacity=".55"/>
    <circle class="s n" cx="96" cy="240" r="30" stroke-width="4"/>
    <circle class="s n" cx="96" cy="240" r="24" stroke-width="1.2" opacity=".35"/>
    <path class="s" d="M117 261 l17 17" stroke-width="6"/>
    <path class="s n" d="M84 231 c4 -5 12 -6 17 -2" stroke-width="2" opacity=".5"/>
  </g>
</svg>

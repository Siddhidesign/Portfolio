<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <style>
    .ink{stroke:#32404f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .box{animation:lock 4.5s ease-in-out infinite}
    .conf{animation:fade 4.5s ease-in-out infinite}
    .leafa{animation:sway 4s ease-in-out infinite;transform-origin:150px 210px}
    .off{animation:blink 3s ease-in-out infinite}
    @keyframes lock{0%,15%{opacity:0;transform:scale(1.15)}30%,100%{opacity:1;transform:scale(1)}}
    @keyframes fade{0%,35%{opacity:0}50%,100%{opacity:1}}
    @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <ellipse cx="200" cy="190" rx="172" ry="98" fill="#cde7d8" opacity=".5"/>
  <!-- plant in the field -->
  <g class="leafa">
    <path class="ink" d="M150 250 q2 -34 0 -58"/>
    <path class="ink" d="M150 208 q-26 -12 -32 -34 q26 2 32 34" fill="#cde7d8"/>
    <path class="ink" d="M150 220 q26 -10 32 -32 q-26 2 -32 32" fill="#cde7d8"/>
    <path class="ink" d="M150 196 q-4 -22 8 -36 q10 18 -8 36" fill="#cde7d8"/>
  </g>
  <!-- phone held up, scanning -->
  <rect class="ink" x="212" y="70" width="112" height="186" rx="16" fill="#fff"/>
  <line class="ink" x1="252" y1="84" x2="284" y2="84" opacity=".4"/>
  <!-- viewfinder plant -->
  <path class="ink" d="M268 214 q2 -26 0 -44" opacity=".7"/>
  <path class="ink" d="M268 182 q-18 -9 -22 -24 q18 1 22 24" fill="#cde7d8" opacity=".8"/>
  <path class="ink" d="M268 190 q18 -7 22 -22 q-18 1 -22 22" fill="#cde7d8" opacity=".8"/>
  <!-- detection box -->
  <g class="box" style="transform-origin:268px 176px">
    <path d="M232 140 h-8 v-8 M304 140 h8 v-8 M232 212 h-8 v8 M304 212 h8 v8" stroke="#e6612e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <rect x="224" y="132" width="88" height="88" rx="4" stroke="#e6612e" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity=".5"/>
  </g>
  <!-- confidence chip -->
  <g class="conf">
    <rect x="228" y="228" width="80" height="20" rx="10" fill="#03ae6f"/>
    <text x="268" y="242" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">87% MATCH</text>
  </g>
  <!-- offline badge -->
  <g class="off">
    <rect class="ink" x="228" y="94" width="80" height="20" rx="10" fill="#fad29d"/>
    <text x="268" y="108" font-family="monospace" font-size="10" fill="#32404f" text-anchor="middle">OFFLINE OK</text>
  </g>
  <!-- hand holding phone -->
  <path class="ink" d="M212 232 q-24 6 -34 26"/>
  <path class="ink" d="M324 232 q22 8 30 26"/>
  <!-- sun -->
  <circle class="ink" cx="72" cy="70" r="16" fill="#fad29d"/>
  <path class="ink" d="M72 44 v-8 M72 104 v8 M46 70 h-8 M98 70 h8" opacity=".6"/>
</svg>
